name: amber-lsp advisory

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changed_lines:
    name: amber-lsp on changed lines (advisory)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # Findings stay advisory through --advisory, which exits 0 on findings.
    # A failed amber-lsp build or a checker exit 2 still fails this job, so a
    # broken linter reads red. The job is not a required check.
    steps:
      - name: Download source with history for the changed-line comparison
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Download amber-lsp at its pinned commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: amberframework/amber_cli
          ref: ede25163faa5574a0b7d28c83a97eef288d9f272 # amberframework/amber_cli#54 reviewed head
          path: .amber_cli_for_lint
          persist-credentials: false
      - name: Refresh apt package index
        # install-crystal runs apt-get install without an update, and the
        # runner image's index goes stale.
        run: sudo apt-get update
      - name: Install Crystal
        uses: crystal-lang/install-crystal@d8ef131ecec0352ce0e39b81b0a6d95def58fe2f # v1
        with:
          crystal: 1.21.0
      - name: Build amber-lsp
        working-directory: .amber_cli_for_lint
        run: crystal build src/amber_lsp.cr -o "$RUNNER_TEMP/amber-lsp"
      - name: Check changed lines
        run: >-
          "$RUNNER_TEMP/amber-lsp" check
          --since "origin/$GITHUB_BASE_REF"
          --format github
          --advisory
